<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Isso ou Aquilo</title><style>:root{--bg:#120b1e;--card:#211532;--card2:#30203f;--border:#49365a;--pink:#ff4f9a;--purple:#8b5cf6;--green:#38d39f;--yellow:#ffd166;--blue:#5db7ff;--text:#fff;--muted:#c8bad3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#120b1e,#28153d);color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:18px 14px 35px}.card{background:#211532;border:1px solid #3d2b4e;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.2)}.logo{text-align:center}.logo .emoji{font-size:58px}.logo h1{margin:8px 0 4px;font-size:32px}.muted{color:#c8bad3}.grid{display:grid;gap:11px}.row{display:flex;gap:10px}.row>*{flex:1}.title{font-size:24px;font-weight:900}.primary,.secondary,.choice{border:0;border-radius:15px;padding:14px 17px;color:#fff;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,#ff4f9a,#8b5cf6);width:100%}.secondary{background:#3a294d;width:100%}.choice{min-height:120px;font-size:22px;background:#30203f;border:1px solid #49365a}.input{width:100%;padding:14px;border-radius:14px;border:1px solid #554364;background:#160e24;color:#fff;outline:none;margin:5px 0}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.tiny{font-size:12px;color:#c8bad3}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#453152;color:#eee;font-size:11px;font-weight:800}.big{text-align:center;font-size:30px;font-weight:950;margin:15px 0}.prompt{background:#2b1b3d;border-radius:19px;padding:25px 18px;text-align:center;font-size:23px;font-weight:850;line-height:1.3;min-height:145px;display:flex;align-items:center;justify-content:center}.score{display:flex;gap:10px;flex-wrap:wrap}.score div{flex:1;min-width:120px;background:#30203f;border-radius:16px;padding:13px;text-align:center}.score b{display:block;font-size:25px}.list{display:grid;gap:8px}.item{background:#2b1b3d;border-radius:14px;padding:12px}.footer{text-align:center;color:#8f819a;font-size:12px;margin-top:18px}.notice{color:#c8bad3;font-size:13px;margin-top:12px;text-align:center}@media(max-width:500px){.app{padding:14px 12px}.logo h1{font-size:28px}.row{flex-direction:column}.choice{min-height:105px}}</style></head><body><div class="app"><div id="app"></div><div class="footer">Jogo local • 1 celular • Sem banco de dados</div></div><script>const pairs=[["Praia", "Montanha"], ["Pizza", "Hambúrguer"], ["Dia", "Noite"], ["Filme", "Série"], ["Café", "Chá"], ["Doce", "Salgado"], ["Verão", "Inverno"], ["WhatsApp", "Instagram"], ["Cidade", "Interior"], ["Casa", "Hotel"], ["Carro", "Moto"], ["Música", "Podcast"], ["Cinema", "Streaming"], ["Churrasco", "Pizza"], ["Acordar cedo", "Dormir até tarde"], ["Viajar", "Ficar em casa"], ["Dinheiro", "Tempo livre"], ["Frio", "Calor"], ["Cachorro", "Gato"], ["Comédia", "Ação"], ["Romântico", "Aventura"], ["Planejar", "Improvisar"], ["Livro", "Filme"], ["Restaurante", "Delivery"], ["Mar", "Piscina"], ["Áudio", "Texto"], ["Pix", "Dinheiro em espécie"], ["Chocolate", "Sorvete"], ["Jogar", "Assistir"], ["Manhã", "Madrugada"], ["Viagem curta", "Viagem longa"], ["Foto", "Vídeo"], ["Comer fora", "Cozinhar"], ["Superpoder de voar", "Superpoder de ficar invisível"], ["Ficar famoso", "Ficar rico"], ["Ser protagonista", "Ser observador"], ["Ganhar uma viagem", "Ganhar dinheiro"]];const state={screen:'home',players:[],current:0,score:{},round:0,used:[],last:null};const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('issoAquiloGame',JSON.stringify(state))}function central(){location.href='index.html'}function render(){let e=$('app');if(state.screen==='home')e.innerHTML=`<div class="logo"><div class="emoji">⚡</div><h1>Isso ou Aquilo</h1><p class="muted">Escolha rápido. Sem pensar demais!</p></div><div class="card"><p class="muted">Cada jogador recebe duas opções. Escolha uma. Cada escolha vale 1 ponto.</p><div class="grid"><button class="primary" onclick="setup()">⚙️ Configurar partida</button><button class="secondary" onclick="central()">🎮 Voltar para a Central</button></div></div>`;else if(state.screen==='setup')setupView(e);else game(e)}function setup(){state.screen='setup';save();render()}function setupView(e){e.innerHTML=`<div class="topbar"><button class="secondary" style="width:auto" onclick="home()">← Voltar</button><span class="tiny">CONFIGURAÇÃO</span></div><div class="card"><div class="title">Participantes</div><div class="row"><input class="input" id="name" placeholder="Nome" onkeydown="if(event.key==='Enter')add()"><button class="primary" onclick="add()">Adicionar</button></div><div class="list">${state.players.map((p,i)=>`<div class="item">#${i+1} <b>${esc(p)}</b></div>`).join('')||'<p class="muted">Adicione pelo menos 2.</p>'}</div><div class="row" style="margin-top:12px"><button class="secondary" onclick="state.players=[];save();render()">Limpar</button><button class="primary" onclick="start()" ${state.players.length<2?'disabled':''}>Começar</button></div></div>`}function home(){state.screen='home';save();render()}function add(){let n=$('name').value.trim();if(!n||state.players.length>=20)return;state.players.push(n);save();render()}function start(){if(state.players.length<2)return;state.score={};state.players.forEach(p=>state.score[p]=0);state.current=0;state.round=0;state.used=[];state.last=null;state.screen='game';save();draw()}function draw(){let a=pairs.map((_,i)=>i).filter(i=>!state.used.includes(i));if(!a.length){state.used=[];a=pairs.map((_,i)=>i)}state.last=a[Math.floor(Math.random()*a.length)];state.used.push(state.last);state.round++;save();render()}function choose(){state.score[state.players[state.current]]++;state.current=(state.current+1)%state.players.length;state.last=null;save();render()}function game(e){let p=state.players[state.current];e.innerHTML=`<div class="topbar"><button class="secondary" style="width:auto" onclick="home()">⌂ Início</button><button class="secondary" style="width:auto" onclick="central()">🎮 Central</button></div><div class="card"><span class="badge">RODADA ${state.round}</span><div class="big">👤 ${esc(p)}</div>${state.last===null?`<div class="prompt">Pronto para a próxima escolha?</div><button class="primary" style="margin-top:12px" onclick="draw()">🎲 Sortear</button>`:`<div class="grid" style="grid-template-columns:1fr 1fr"><button class="choice" onclick="choose()">👉 ${esc(pairs[state.last][0])}</button><button class="choice" onclick="choose()">👉 ${esc(pairs[state.last][1])}</button></div>`}</div><div class="card"><b>Pontuação</b><div class="score" style="margin-top:10px">${state.players.map(x=>`<div><b>${state.score[x]||0}</b>${esc(x)}</div>`).join('')}</div></div>`}try{let x=JSON.parse(localStorage.getItem('issoAquiloGame'));if(x)Object.assign(state,x)}catch(e){}render();</script></body></html>
