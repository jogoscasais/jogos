<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Eu Nunca</title><style>:root{--bg:#120b1e;--card:#211532;--card2:#30203f;--border:#49365a;--pink:#ff4f9a;--purple:#8b5cf6;--green:#38d39f;--yellow:#ffd166;--blue:#5db7ff;--text:#fff;--muted:#c8bad3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#120b1e,#28153d);color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:18px 14px 35px}.card{background:#211532;border:1px solid #3d2b4e;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.2)}.logo{text-align:center}.logo .emoji{font-size:58px}.logo h1{margin:8px 0 4px;font-size:32px}.muted{color:#c8bad3}.grid{display:grid;gap:11px}.row{display:flex;gap:10px}.row>*{flex:1}.title{font-size:24px;font-weight:900}.primary,.secondary,.choice{border:0;border-radius:15px;padding:14px 17px;color:#fff;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,#ff4f9a,#8b5cf6);width:100%}.secondary{background:#3a294d;width:100%}.choice{min-height:120px;font-size:22px;background:#30203f;border:1px solid #49365a}.input{width:100%;padding:14px;border-radius:14px;border:1px solid #554364;background:#160e24;color:#fff;outline:none;margin:5px 0}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.tiny{font-size:12px;color:#c8bad3}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#453152;color:#eee;font-size:11px;font-weight:800}.big{text-align:center;font-size:30px;font-weight:950;margin:15px 0}.prompt{background:#2b1b3d;border-radius:19px;padding:25px 18px;text-align:center;font-size:23px;font-weight:850;line-height:1.3;min-height:145px;display:flex;align-items:center;justify-content:center}.score{display:flex;gap:10px;flex-wrap:wrap}.score div{flex:1;min-width:120px;background:#30203f;border-radius:16px;padding:13px;text-align:center}.score b{display:block;font-size:25px}.list{display:grid;gap:8px}.item{background:#2b1b3d;border-radius:14px;padding:12px}.footer{text-align:center;color:#8f819a;font-size:12px;margin-top:18px}.notice{color:#c8bad3;font-size:13px;margin-top:12px;text-align:center}@media(max-width:500px){.app{padding:14px 12px}.logo h1{font-size:28px}.row{flex-direction:column}.choice{min-height:105px}}</style></head><body><div class="app"><div id="app"></div><div class="footer">Jogo local • 1 celular • Sem banco de dados</div></div><script>const prompts=["Eu nunca menti para escapar de uma situação.", "Eu nunca dormi no lugar errado.", "Eu nunca mandei mensagem para a pessoa errada.", "Eu nunca fingi entender algo que não entendi.", "Eu nunca ri em um momento completamente inadequado.", "Eu nunca esqueci o nome de alguém logo depois de conhecê-lo.", "Eu nunca cantei no chuveiro.", "Eu nunca dancei sozinho em casa.", "Eu nunca assisti uma série inteira em poucos dias.", "Eu nunca comi escondido para não dividir.", "Eu nunca culpei outra pessoa por algo que eu fiz.", "Eu nunca fiquei acordado até de madrugada sem necessidade.", "Eu nunca pesquisei meu próprio nome na internet.", "Eu nunca tirei uma foto e apaguei por vergonha.", "Eu nunca fingi estar ocupado para não conversar.", "Eu nunca esqueci uma senha importante.", "Eu nunca fiquei com vergonha depois de mandar um áudio.", "Eu nunca inventei uma desculpa para cancelar um compromisso.", "Eu nunca ri tanto que comecei a chorar.", "Eu nunca tropecei em público e fingi que nada aconteceu.", "Eu nunca usei o celular durante uma conversa escondido.", "Eu nunca comi algo que caiu no chão.", "Eu nunca falei sozinho.", "Eu nunca tive uma paixão secreta.", "Eu nunca fiquei olhando o perfil de alguém por curiosidade.", "Eu nunca dormi durante um filme.", "Eu nunca esqueci onde deixei o celular enquanto estava com ele na mão.", "Eu nunca fiz uma compra por impulso.", "Eu nunca cantei uma música inventando a letra.", "Eu nunca fingi estar doente para não fazer alguma coisa.", "Eu nunca mandei uma mensagem e me arrependi imediatamente.", "Eu nunca confundi duas pessoas pelo nome.", "Eu nunca entrei em uma sala e esqueci por que fui até lá.", "Eu nunca tentei parecer mais confiante do que estava.", "Eu nunca fiz uma promessa e depois esqueci.", "Eu nunca contei um segredo sem querer.", "Eu nunca tive medo de um animal pequeno.", "Eu nunca assisti a um vídeo várias vezes porque era engraçado.", "Eu nunca fiquei acordado pensando em uma conversa.", "Eu nunca usei uma desculpa esfarrapada e torci para acreditarem.", "Eu nunca fiz uma careta quando ninguém estava olhando.", "Eu nunca peguei comida do prato de outra pessoa sem pedir.", "Eu nunca disse 'já estou chegando' sem ter saído de casa.", "Eu nunca deixei uma mensagem sem responder de propósito.", "Eu nunca esqueci um aniversário importante.", "Eu nunca fiquei nervoso antes de falar em público.", "Eu nunca tive vontade de voltar no tempo para corrigir uma situação.", "Eu nunca tentei descobrir um presente antes da hora.", "Eu nunca fiz uma brincadeira e me arrependi porque foi longe demais.", "Eu nunca fiquei com ciúmes sem admitir."];const state={screen:'home',players:[],current:0,used:[],round:0,history:[]};const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('euNuncaGame',JSON.stringify(state))}function central(){location.href='index.html'}function render(){let e=$('app');if(state.screen==='home')e.innerHTML=`<div class="logo"><div class="emoji">🙈</div><h1>Eu Nunca</h1><p class="muted">Descubra quem já fez isso!</p></div><div class="card"><div class="title">Como jogar</div><p class="muted">Cadastre os participantes. Em cada rodada, leia a frase. Quem já fez o que foi dito levanta a mão ou abaixa um dedo.</p><div class="grid"><button class="primary" onclick="setup()">⚙️ Configurar partida</button><button class="secondary" onclick="central()">🎮 Voltar para a Central</button></div></div>`;else if(state.screen==='setup')setupView(e);else game(e)}function setup(){state.screen='setup';save();render()}function setupView(e){e.innerHTML=`<div class="topbar"><button class="secondary" style="width:auto" onclick="home()">← Voltar</button><span class="tiny">CONFIGURAÇÃO</span></div><div class="card"><div class="title">Participantes</div><p class="muted">Adicione de 2 a 20 pessoas.</p><div class="row"><input class="input" id="name" placeholder="Nome" onkeydown="if(event.key==='Enter')add()"><button class="primary" onclick="add()">Adicionar</button></div><div class="list">${state.players.map((p,i)=>`<div class="item">#${i+1} <b>${esc(p)}</b></div>`).join('')||'<p class="muted">Nenhum participante.</p>'}</div><div class="row" style="margin-top:12px"><button class="secondary" onclick="state.players=[];save();render()">Limpar</button><button class="primary" onclick="start()" ${state.players.length<2?'disabled':''}>Começar</button></div></div>`}function home(){state.screen='home';save();render()}function add(){let n=$('name').value.trim();if(!n||state.players.length>=20)return;if(state.players.some(p=>p.toLowerCase()===n.toLowerCase()))return alert('Esse nome já foi adicionado.');state.players.push(n);save();render()}function start(){if(state.players.length<2)return;state.current=-1;state.used=[];state.round=0;state.history=[];state.screen='game';save();next()}function next(){let a=prompts.map((_,i)=>i).filter(i=>!state.used.includes(i));if(!a.length){state.used=[];a=prompts.map((_,i)=>i)}let i=a[Math.floor(Math.random()*a.length)];state.used.push(i);state.round++;state.history.unshift(prompts[i]);state.history=state.history.slice(0,8);state.current=(state.current+1)%state.players.length;save();render()}function game(e){let current=state.players[state.current],phrase=state.history[0]||'Clique em sortear para começar.';e.innerHTML=`<div class="topbar"><button class="secondary" style="width:auto" onclick="home()">⌂ Início</button><button class="secondary" style="width:auto" onclick="central()">🎮 Central</button></div><div class="card"><span class="badge">RODADA ${state.round}</span><div class="big">🙋 ${esc(current)}</div><div class="prompt">${esc(phrase)}</div><p class="notice">Quem já fez isso pode levantar a mão. Depois, sorteie a próxima frase.</p><button class="primary" style="margin-top:12px" onclick="next()">🎲 Próxima frase</button></div><div class="card"><b>Últimas frases</b><div class="list" style="margin-top:10px">${state.history.map((x,i)=>`<div class="item">${i===0?'👉 ':''}${esc(x)}</div>`).join('')}</div></div>`}try{let x=JSON.parse(localStorage.getItem('euNuncaGame'));if(x)Object.assign(state,x)}catch(e){}render();</script></body></html>
