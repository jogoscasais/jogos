<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mímica — Jogo de Casais</title>
<style>
:root{--bg:#120c1f;--card:#211532;--card2:#2d1d40;--pink:#ff4f9a;--purple:#8b5cf6;--green:#38d39f;--red:#ff667a;--yellow:#ffd166;--text:#fff;--muted:#c9bdd6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2a1741,#120c1f 55%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:760px;margin:auto;padding:18px 16px 40px}.logo{text-align:center;margin:8px 0 22px}.logo h1{font-size:34px;margin:0}.logo p{color:var(--muted);margin:7px 0}.card{background:rgba(33,21,50,.96);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:20px;box-shadow:0 15px 50px rgba(0,0,0,.3);margin-bottom:14px}.title{font-size:25px;font-weight:800;margin:0 0 7px}.muted{color:var(--muted)}.grid{display:grid;gap:10px}.row{display:flex;gap:10px}.row>*{flex:1}.primary{width:100%;padding:15px 18px;border-radius:15px;background:linear-gradient(135deg,var(--pink),var(--purple));color:white;font-weight:800}.secondary{width:100%;padding:13px 18px;border-radius:15px;background:#3a294d;color:white}.danger{background:#4b2532}.input,.select{width:100%;padding:14px;border-radius:14px;border:1px solid #554364;background:#160e24;color:white;outline:none;margin:7px 0}.couple-list{display:grid;gap:9px;margin:14px 0}.couple{display:flex;justify-content:space-between;align-items:center;background:#2b1b3d;padding:14px;border-radius:16px}.score{font-size:23px;font-weight:900;color:#ff75ad}.scoreboard{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.scorebox{text-align:center;background:#2b1b3d;border-radius:16px;padding:10px}.scorebox .n{font-weight:800;font-size:15px}.scorebox .s{font-size:30px;font-weight:900;color:#ff75ad}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.tiny{font-size:12px;color:var(--muted)}.timer{text-align:center;font-size:68px;font-weight:950;line-height:1;color:var(--yellow);margin:8px 0}.timer.warning{color:var(--red);animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.04)}}.turn{text-align:center;color:#ffd1e6;font-weight:900;font-size:18px}.category{text-align:center;color:#cdb9dc;font-size:14px;margin-top:4px}.word{font-size:42px;line-height:1.08;text-align:center;font-weight:950;padding:34px 8px;min-height:170px;display:flex;align-items:center;justify-content:center}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.correct{background:var(--green);color:#09251c;padding:17px;border-radius:15px;font-weight:900}.pass{background:#514063;color:white;padding:17px;border-radius:15px;font-weight:900}.start{background:linear-gradient(135deg,#ffb000,#ff4f9a);color:white;padding:17px;border-radius:15px;font-weight:900;width:100%}.notice{padding:12px;border-radius:14px;background:#342241;color:#e9dff0;font-size:14px;margin-top:10px}.progress{height:8px;background:#39284b;border-radius:20px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));transition:.3s}.hidden{display:none!important}.winner{text-align:center}.winner .trophy{font-size:65px}.winner h2{font-size:31px;margin:5px 0}.footer{text-align:center;color:#8f809e;font-size:12px;margin-top:20px}
@media(max-width:500px){.app{padding:14px 12px}.logo h1{font-size:29px}.word{font-size:36px;min-height:155px}.actions{grid-template-columns:1fr}.timer{font-size:62px}}
</style>
</head>
<body>
<div class="app"><div id="app"></div><div class="footer">Jogo local • 1 celular • Sem banco de dados</div></div>
<script>
const CATEGORIES={
"Animais":["Cachorro","Gato","Macaco","Leão","Elefante","Girafa","Cobra","Jacaré","Galinha","Pinguim","Cavalo","Porco","Coelho","Tartaruga","Sapo","Peixe","Tubarão","Golfinho","Papagaio","Gorila","Urso","Canguru","Pato","Abelha","Borboleta","Leopardo","Tigre","Onça","Zebra","Rinoceronte","Hipopótamo","Cervo","Raposa","Lobo","Esquilo","Morcego","Coruja","Águia","Falcão","Pavão","Peru","Galo","Ovelha","Cabra","Vaca","Burro","Porquinho-da-índia","Hamster","Rato","Aranha","Formiga","Caranguejo","Polvo","Baleia","Foca","Pinguim"],
"Profissões":["Médico","Dentista","Professor","Policial","Bombeiro","Cozinheiro","Garçom","Piloto de avião","Motorista","Pedreiro","Eletricista","Mecânico","Fotógrafo","Cantor","Dançarino","Ator","Jogador de futebol","Cabeleireiro","Padeiro","Veterinário","Carteiro","Pescador","Jardineiro","Astronauta","Repórter","Enfermeiro","Advogado","Juiz","Arquiteto","Engenheiro","Programador","Designer","Jornalista","Contador","Bancário","Vendedor","Garimpeiro","Agricultor","Fazendeiro","Costureiro","Barbeiro","Maquiador","Modelo","Músico","Pintor","Pedagogo","Psicólogo","Cientista","Biólogo","Farmacêutico","Chef de cozinha","Garçom de hotel","Recepcionista","Barman","Entregador","Piloto de corrida"],
"Objetos":["Celular","Guarda-chuva","Escova de dentes","Óculos","Cadeira","Mesa","Relógio","Câmera","Mala","Travesseiro","Panela","Vassoura","Chave","Controle remoto","Computador","Fone de ouvido","Bicicleta","Violão","Bola","Livro","Espelho","Televisão","Geladeira","Ventilador","Mochila","Carteira","Caneta","Lápis","Caderno","Tesoura","Martelo","Chave de fenda","Alicate","Furadeira","Capacete","Boné","Sapato","Chinelo","Meia","Camisa","Calça","Jaqueta","Escova de cabelo","Secador de cabelo","Ferro de passar","Liquidificador","Micro-ondas","Garfo","Faca","Colher","Prato","Copo","Xícara","Garrafa","Panela de pressão","Almofada","Cobertor"],
"Ações":["Correr","Pular","Nadar","Dormir","Comer","Beber","Escovar os dentes","Tomar banho","Pentear o cabelo","Dirigir","Cozinhar","Dançar","Cantar","Chorar","Rir","Espirrar","Tossir","Pescar","Fotografar","Ler","Escrever","Telefonar","Malhar","Jogar futebol","Andar de bicicleta","Acordar","Bocejar","Bater palmas","Assobiar","Gritar","Sussurrar","Abraçar","Beijar","Apertar a mão","Acenar","Sentar","Levantar","Cair","Escorregar","Caminhar","Subir escada","Descer escada","Abrir uma porta","Fechar uma porta","Lavar roupa","Lavar louça","Varrer","Passar roupa","Fazer compras","Dirigir moto","Pilotar avião","Tocar violão","Tocar bateria","Desenhar","Pintar","Pescar peixe","Plantar uma árvore"],
"Filmes e personagens":["Homem-Aranha","Batman","Superman","Hulk","Harry Potter","Mickey Mouse","Pikachu","Shrek","Homer Simpson","Bob Esponja","Elsa","Minions","Darth Vader","Jack Sparrow","Woody","Buzz Lightyear","Chaves","Mônica","Coringa","Mulher-Maravilha","Tarzan","Peter Pan","Pinóquio","Cinderela","Branca de Neve","Thor","Homem de Ferro","Capitão América","Hulk","Wolverine","Deadpool","Flash","Aquaman","Merida","Moana","Simba","Nemo","Dory","Toy Story","Frozen","Os Incríveis","Kung Fu Panda","Po","Scooby-Doo","Tom","Jerry","Patolino","Pernalonga","Super Mario","Luigi","Sonic","Naruto","Goku","Barbie","Ken","Mr. Bean","Rambo"],
"Comidas":["Pizza","Hambúrguer","Cachorro-quente","Pipoca","Sorvete","Brigadeiro","Bolo","Arroz","Feijão","Macarrão","Churrasco","Pastel","Coxinha","Batata frita","Pão de queijo","Açaí","Sushi","Taco","Milho","Melancia","Banana","Coco","Limão","Ovo frito","Panqueca","Lasanha","Esfirra","Kibe","Empada","Torta","Pudim","Mousse","Chocolate","Biscoito","Bolacha","Pão","Queijo","Presunto","Omelete","Salada","Sopa","Caldo","Farofa","Purê de batata","Frango assado","Peixe frito","Camarão","Linguiça","Hambúrguer com queijo","Hot dog","Churros","Paçoca","Pé de moleque","Manga","Morango","Uva","Abacaxi","Mamão"],
"Esportes":["Futebol","Basquete","Vôlei","Tênis","Natação","Boxe","Judô","Karatê","Surfe","Skate","Ciclismo","Corrida","Golfe","Boliche","Esqui","Patinação","Ginástica","Handebol","Beisebol","Tênis de mesa","Arco e flecha","Levantamento de peso","Fórmula 1","Paraquedismo","Rugby","Futsal","Futebol americano","Hóquei","MMA","Taekwondo","Capoeira","Badminton","Triatlo","Maratona","Canoagem","Remo","Escalada","Hipismo","Motocross","Kart","BMX","Slackline","Peteca","Queimada","Polo aquático","Sinuca","Dardos","Bocha","Vela","Pesca esportiva","Luta livre","Esgrima","Pentatlo","Surf de vela","Crossfit","Musculação"],
"Situações":["Perder o ônibus","Chegar atrasado","Esquecer a chave","Perder o celular","Tomar um susto","Ganhar um presente","Abrir um presente","Ficar preso no elevador","Pegar chuva","Quebrar um copo","Derrubar comida","Ver uma barata","Tirar uma selfie","Fazer uma ligação","Receber uma notícia boa","Receber uma notícia ruim","Ir ao supermercado","Fazer uma viagem","Perder o voo","Montar uma barraca","Cortar o cabelo","Ir ao dentista","Fazer uma prova","Dirigir no trânsito","Fazer compras","Esquecer o aniversário","Perder a carteira","Esquecer a senha","Queimar a comida","Derramar café","Quebrar o celular","Ficar sem internet","Perder o ônibus escolar","Errar o caminho","Chegar em uma festa","Dançar em público","Cantar no karaokê","Ganhar na loteria","Perder um jogo","Encontrar dinheiro","Ver um cachorro bravo","Fugir de uma abelha","Pegar um elevador lotado","Ficar preso no trânsito","Esquecer o guarda-chuva","Chegar em casa cansado","Dormir no sofá","Roncar no ônibus","Perder uma meia","Procurar o controle remoto","Fazer uma surpresa","Esconder um presente","Receber uma mensagem inesperada","Fazer uma mudança","Montar um móvel","Cair na piscina","Pisar em uma poça"],
"Casal":["Primeiro encontro","Pedido de namoro","Pedido de casamento","Beijo","Abraço","Ciúmes","Briga de casal","Reconciliação","Jantar romântico","Viagem a dois","Presente surpresa","Assistir filme juntos","Tirar foto juntos","Cozinhar para o outro","Dançar juntos","Dormir abraçado","Escolher restaurante","Montar uma casa","Lua de mel","Aniversário de namoro","Fazer compras juntos","Dividir a sobremesa","Planejar uma viagem","Trocar presentes","Declarar amor","Primeiro beijo","Conhecer os sogros","Conhecer a família","Aliança de namoro","Aliança de casamento","Noivado","Pedido surpresa","Café da manhã na cama","Piquenique a dois","Cinema a dois","Praia a dois","Viajar de avião juntos","Dividir o cobertor","Disputar o controle remoto","Escolher filme juntos","Fazer jantar romântico","Dançar uma música lenta","Tirar foto abraçados","Mandar mensagem carinhosa","Dar flores","Dar chocolate","Fazer uma surpresa","Comemorar aniversário","Comemorar aniversário de namoro","Planejar férias","Montar árvore de Natal juntos","Decorar a casa juntos","Fazer compras no mercado","Dividir tarefas domésticas","Fazer planos para o futuro","Adotar um pet juntos"]
};
CATEGORIES["Geral"]=Object.values(CATEGORIES).flat();let state={screen:"home",couples:[],current:0,category:"Geral",mode:"minute",word:"",time:60,running:false,interval:null,roundPoints:0,roundWords:0,used:[],evaluating:false};

const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function save(){const x={...state,interval:null};localStorage.setItem("mimicaCasais",JSON.stringify(x))}
function load(){try{const x=JSON.parse(localStorage.getItem("mimicaCasais"));if(x)state={...state,...x};state.interval=null}catch(e){}}
function central(){location.href="index.html"}
function goSetup(){state.screen="setup";save();render()}
function render(){const e=$("app");if(state.screen==="home")home(e);else if(state.screen==="setup")setup(e);else if(state.screen==="game")game(e);else if(state.screen==="end")end(e)}
function home(e){e.innerHTML=`<div class="logo"><div style="font-size:55px">🎭</div><h1>Mímica de Casais</h1><p>Faça a mímica antes que o tempo acabe!</p></div>
<div class="card"><div class="title">Como jogar</div><p class="muted">Um casal por vez escolhe quem fará a mímica. O celular mostra a palavra somente para quem está fazendo a mímica. O parceiro tenta adivinhar.</p>
<div class="notice">⏱️ Cada rodada dura <b>1 minuto</b>. Cada palavra acertada vale <b>1 ponto</b>. Você pode passar uma palavra sem marcar ponto.</div></div>
<div class="grid"><button class="primary" onclick="goSetup()">🎭 Configurar partida</button><button class="secondary" onclick="central()">🎮 Central de Jogos</button></div>`}
function setup(e){let rows=state.couples.map((c,i)=>`<div class="couple"><div><b>Casal ${i+1}</b><div class="tiny">${esc(c.name)}</div></div><b class="score">${c.score}</b></div>`).join("");
let opts=Object.keys(CATEGORIES).map(c=>`<option value="${esc(c)}" ${state.category===c?"selected":""}>${esc(c)} (${CATEGORIES[c].length})</option>`).join("");
e.innerHTML=`<div class="topbar"><button class="secondary" style="width:auto;padding:9px 13px" onclick="homeBack()">← Início</button><button class="secondary" style="width:auto;padding:9px 13px" onclick="central()">🎮 Central</button></div>
<div class="card"><div class="title">Cadastre os casais</div><p class="muted">Adicione os casais que vão disputar a partida.</p>
<div class="row"><input class="input" id="name" placeholder="Ex.: Ana & João"><button class="primary" style="flex:0 0 110px;margin:7px 0" onclick="add()">Adicionar</button></div>
<div class="couple-list">${rows||'<p class="muted">Nenhum casal cadastrado.</p>'}</div>
<label class="tiny">CATEGORIA DAS PALAVRAS</label><select class="select" id="cat" onchange="state.category=this.value;save()">${opts}</select>
<div class="notice">Na categoria <b>Geral</b>, todas as palavras disponíveis são misturadas.</div>
<label class="tiny">MODO DE JOGO</label><select class="select" id="mode" onchange="state.mode=this.value;save()"><option value="minute" ${state.mode==="minute"?"selected":""}>⏱️ 1 minuto — várias palavras</option><option value="single" ${state.mode==="single"?"selected":""}>🎯 1 palavra por rodada — decidir após 1 minuto</option></select>
<button class="primary" style="margin-top:10px" onclick="start()" ${state.couples.length<1?"disabled":""}>Começar partida</button></div>`}
function add(){let v=$("name").value.trim();if(!v)return;state.couples.push({name:v,score:0});$("name").value="";save();render()}
function homeBack(){state.screen="home";save();render()}
function start(){if(!state.couples.length)return;state.couples.forEach(c=>c.score=0);state.current=0;state.time=60;state.running=false;state.roundPoints=0;state.roundWords=0;state.used=[];state.word="";state.screen="game";save();render()}
function nextWord(){let list=CATEGORIES[state.category]||CATEGORIES.Geral;let available=list.filter(x=>!state.used.includes(x));if(!available.length){state.used=[];available=list}state.word=available[Math.floor(Math.random()*available.length)];state.used.push(state.word);save()}
function game(e){
let c=state.couples[state.current];let pct=(state.time/60)*100;
let single=state.mode==="single";
let boards=state.couples.map((x,i)=>`<div class="scorebox"><div class="n">${esc(x.name)}</div><div class="s">${x.score}</div></div>`).join("");
let startBtn=!state.running&&state.time===60?`<button class="start" onclick="beginRound()">▶ COMEÇAR 1 MINUTO</button>`:"";
e.innerHTML=`<div class="topbar"><div class="row" style="flex:0 0 auto"><button class="secondary" style="width:auto;padding:9px 13px" onclick="stopRound();setupBack()">← Configuração</button><button class="secondary" style="width:auto;padding:9px 13px" onclick="central()">🎮 Central</button></div><span class="tiny">RODADA ${state.current+1}</span></div>
<div class="scoreboard">${boards}</div>
<div class="card"><div class="turn">🎭 VEZ DE: ${esc(c.name).toUpperCase()}</div><div class="category">Categoria: ${esc(state.category)}</div>
<div class="timer ${state.time<=10&&state.running?"warning":""}">${state.time}s</div><div class="progress"><i style="width:${pct}%"></i></div>
${state.running?`<div class="word">${esc(state.word)}</div><div class="actions">${single?`<div class="notice" style="grid-column:1/-1">Quando a mímica terminar, finalize o cronômetro para registrar se acertou ou errou.</div><button class="primary" style="grid-column:1/-1" onclick="finishTimer()">⏹ FINALIZAR CRONÔMETRO<br><small>Parar o tempo e avaliar a mímica</small></button>`:`<button class="correct" onclick="correct()">✓ ACERTOU<br><small>+1 ponto</small></button><button class="pass" onclick="pass()">↷ PASSAR<br><small>próxima palavra</small></button>`}</div>`:state.mode==="single"&&state.evaluating?`<div class="word">${esc(state.word)}</div><div class="notice" style="text-align:center"><b>Tempo finalizado!</b><br>Agora avalie a mímica.</div><div class="actions"><button class="correct" onclick="singleCorrect()">✓ ACERTOU<br><small>+1 ponto e próximo casal</small></button><button class="wrong" onclick="singleWrong()">✕ ERROU<br><small>próximo casal</small></button></div>`:`<div class="word" style="font-size:23px">Quando começar, mostre esta tela apenas para quem fará a mímica.</div>${startBtn}`}
<div class="notice">Palavras acertadas nesta rodada: <b>${state.roundPoints}</b> • Palavras apresentadas: <b>${state.roundWords}</b></div></div>
${!state.running&&state.time<60&&state.mode!=="single"?`<div class="card"><button class="primary" onclick="nextCouple()">Próximo casal</button></div>`:""}
<div class="card"><button class="secondary danger" onclick="finish()">Encerrar partida</button></div>`}
function beginRound(){state.time=60;state.roundPoints=0;state.roundWords=0;state.used=[];state.evaluating=false;nextWord();state.running=true;save();render();state.interval=setInterval(tick,1000)}
function tick(){if(!state.running)return;state.time--;if(state.time<=0){state.time=0;stopRound();state.evaluating=state.mode==="single";save();render();return}render()}
function correct(){if(!state.running)return;state.couples[state.current].score++;state.roundPoints++;state.roundWords++;nextWord();render()}
function pass(){if(!state.running)return;state.roundWords++;nextWord();render()}
function finishTimer(){if(state.mode!=="single"||!state.running)return;stopRound();state.evaluating=true;save();render()}
function singleCorrect(){if(state.mode!=="single"||!state.evaluating)return;state.couples[state.current].score++;state.roundPoints=1;nextCouple()}
function singleWrong(){if(state.mode!=="single"||!state.evaluating)return;state.roundPoints=0;nextCouple()}
function stopRound(){if(state.interval){clearInterval(state.interval);state.interval=null}state.running=false;save()}
function setupBack(){state.screen="setup";state.time=60;state.evaluating=false;state.word="";save();render()}
function nextCouple(){state.current=(state.current+1)%state.couples.length;state.time=60;state.evaluating=false;state.word="";state.roundPoints=0;state.roundWords=0;state.used=[];state.running=false;save();render()}
function finish(){stopRound();state.screen="end";save();render()}
function end(e){let ranking=[...state.couples].sort((a,b)=>b.score-a.score);e.innerHTML=`<div class="card winner"><div class="trophy">🏆</div><div class="tiny">FIM DA PARTIDA</div><h2>${esc(ranking[0]?.name||"")}</h2><p class="muted">Pontuação final</p><div class="scorebox"><div class="s">${ranking[0]?.score||0}</div><div class="n">pontos</div></div></div>
<div class="card"><div class="title">Placar final</div>${ranking.map((c,i)=>`<div class="couple"><div><b>${i+1}º — ${esc(c.name)}</b></div><b class="score">${c.score}</b></div>`).join("")}</div>
<div class="grid"><button class="primary" onclick="state.screen='setup';state.couples.forEach(c=>c.score=0);save();render()">Nova partida</button><button class="secondary" onclick="central()">🎮 Voltar para a Central</button></div>`}
load();render();
</script>
</body></html>
