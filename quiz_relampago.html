<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Quiz Relâmpago</title><style>:root{--bg:#120b1e;--card:#211532;--card2:#30203f;--border:#49365a;--pink:#ff4f9a;--purple:#8b5cf6;--green:#38d39f;--yellow:#ffd166;--blue:#5db7ff;--text:#fff;--muted:#c8bad3}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#120b1e,#28153d);color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:18px 14px 35px}.card{background:#211532;border:1px solid #3d2b4e;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.2)}.logo{text-align:center}.logo .emoji{font-size:58px}.logo h1{margin:8px 0 4px;font-size:32px}.muted{color:#c8bad3}.grid{display:grid;gap:11px}.row{display:flex;gap:10px}.row>*{flex:1}.title{font-size:24px;font-weight:900}.primary,.secondary,.choice{border:0;border-radius:15px;padding:14px 17px;color:#fff;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,#ff4f9a,#8b5cf6);width:100%}.secondary{background:#3a294d;width:100%}.choice{min-height:120px;font-size:22px;background:#30203f;border:1px solid #49365a}.input{width:100%;padding:14px;border-radius:14px;border:1px solid #554364;background:#160e24;color:#fff;outline:none;margin:5px 0}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.tiny{font-size:12px;color:#c8bad3}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#453152;color:#eee;font-size:11px;font-weight:800}.big{text-align:center;font-size:30px;font-weight:950;margin:15px 0}.prompt{background:#2b1b3d;border-radius:19px;padding:25px 18px;text-align:center;font-size:23px;font-weight:850;line-height:1.3;min-height:145px;display:flex;align-items:center;justify-content:center}.score{display:flex;gap:10px;flex-wrap:wrap}.score div{flex:1;min-width:120px;background:#30203f;border-radius:16px;padding:13px;text-align:center}.score b{display:block;font-size:25px}.list{display:grid;gap:8px}.item{background:#2b1b3d;border-radius:14px;padding:12px}.footer{text-align:center;color:#8f819a;font-size:12px;margin-top:18px}.notice{color:#c8bad3;font-size:13px;margin-top:12px;text-align:center}@media(max-width:500px){.app{padding:14px 12px}.logo h1{font-size:28px}.row{flex-direction:column}.choice{min-height:105px}}</style></head><body><div class="app"><div id="app"></div><div class="footer">Jogo local • 1 celular • Sem banco de dados</div></div><script>const qs=[["Qual é o maior planeta do Sistema Solar?", ["Terra", "Júpiter", "Marte", "Saturno"], 1], ["Quantos lados tem um hexágono?", ["5", "6", "7", "8"], 1], ["Qual é a capital do Brasil?", ["São Paulo", "Brasília", "Rio de Janeiro", "Salvador"], 1], ["Qual animal é conhecido como rei da selva?", ["Leão", "Tigre", "Elefante", "Lobo"], 0], ["Qual é o resultado de 7 x 8?", ["54", "56", "64", "48"], 1], ["Qual oceano banha a costa leste do Brasil?", ["Pacífico", "Índico", "Atlântico", "Ártico"], 2], ["Qual planeta é conhecido como planeta vermelho?", ["Vênus", "Marte", "Mercúrio", "Netuno"], 1], ["Quantos minutos há em uma hora?", ["30", "45", "60", "90"], 2], ["Qual é o maior órgão do corpo humano?", ["Coração", "Pele", "Pulmão", "Fígado"], 1], ["Qual gás é essencial para a respiração humana?", ["Oxigênio", "Hélio", "Hidrogênio", "Neônio"], 0], ["Qual instrumento tem teclas e pedais?", ["Violão", "Piano", "Flauta", "Tambor"], 1], ["Em que continente fica o Egito?", ["Ásia", "Europa", "África", "Oceania"], 2], ["Qual é a cor resultante da mistura de azul e amarelo?", ["Roxo", "Verde", "Laranja", "Rosa"], 1], ["Quantos dias tem um ano comum?", ["360", "365", "366", "364"], 1], ["Qual é o satélite natural da Terra?", ["Sol", "Lua", "Marte", "Vênus"], 1], ["Qual idioma é predominante no Brasil?", ["Espanhol", "Português", "Inglês", "Francês"], 1], ["Qual esporte usa uma cesta e uma bola?", ["Futebol", "Vôlei", "Basquete", "Tênis"], 2], ["Qual é o menor número primo?", ["0", "1", "2", "3"], 2], ["Qual animal produz lã?", ["Ovelha", "Cavalo", "Galinha", "Peixe"], 0], ["Qual é a estrela do nosso sistema?", ["Lua", "Sol", "Sirius", "Marte"], 1], ["Quantos meses têm 31 dias?", ["5", "6", "7", "8"], 2], ["Qual metal é representado pelo símbolo Au?", ["Prata", "Ouro", "Ferro", "Cobre"], 1], ["Qual é o continente mais extenso?", ["África", "Ásia", "Europa", "América"], 1], ["Qual esporte é disputado em Wimbledon?", ["Tênis", "Futebol", "Golfe", "Boxe"], 0], ["Qual é a fórmula da água?", ["CO2", "O2", "H2O", "NaCl"], 2], ["Qual destes é um mamífero?", ["Tubarão", "Golfinho", "Pinguim", "Crocodilo"], 1], ["Quantos graus tem um ângulo reto?", ["45", "60", "90", "180"], 2], ["Qual é o plural de cidadão?", ["Cidadões", "Cidadãos", "Cidadães", "Cidadans"], 1], ["Qual planeta é o mais próximo do Sol?", ["Mercúrio", "Vênus", "Terra", "Marte"], 0], ["Qual país tem formato aproximado de uma bota?", ["Brasil", "Itália", "Canadá", "Japão"], 1]];const state={screen:'home',players:[],current:0,score:{},used:[],q:null,answer:null,round:0};const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('quizGame',JSON.stringify(state))}function central(){location.href='index.html'}function render(){let e=$('app');if(state.screen==='home')e.innerHTML=`<div class="logo"><div class="emoji">🧠</div><h1>Quiz Relâmpago</h1><p class="muted">Perguntas rápidas • 1 ponto por acerto</p></div><div class="card"><p class="muted">Cada jogador responde uma pergunta de múltipla escolha. Depois, passa a vez.</p><div class="grid"><button class="primary" onclick="setup()">⚙️ Configurar partida</button><button class="secondary" onclick="central()">🎮 Voltar para a Central</button></div></div>`;else if(state.screen==='setup')setupView(e);else game(e)}function setup(){state.screen='setup';save();render()}function setupView(e){e.innerHTML=`<div class="topbar"><button class="secondary" style="width:auto" onclick="home()">← Voltar</button><span class="tiny">CONFIGURAÇÃO</span></div><div class="card"><div class="title">Participantes</div><p class="muted">Adicione de 2 a 20 jogadores.</p><div class="row"><input class="input" id="name" placeholder="Nome" onkeydown="if(event.key==='Enter')add()"><button class="primary" onclick="add()">Adicionar</button></div><div class="list">${state.players.map((p,i)=>`<div class="item">#${i+1} <b>${esc(p)}</b></div>`).join('')||'<p class="muted">Nenhum participante.</p>'}</div><div class="row" style="margin-top:12px"><button class="secondary" onclick="state.players=[];save();render()">Limpar</button><button class="primary" onclick="start()" ${state.players.length<2?'disabled':''}>Começar</button></div></div>`}function home(){state.screen='home';save();render()}function add(){let n=$('name').value.trim();if(!n||state.players.length>=20)return;state.players.push(n);save();render()}function start(){if(state.players.length<2)return;state.score={};state.players.forEach(p=>state.score[p]=0);state.current=0;state.used=[];state.round=0;state.answer=null;state.screen='game';nextQuestion()}function nextQuestion(){let a=qs.map((_,i)=>i).filter(i=>!state.used.includes(i));if(!a.length){state.used=[];a=qs.map((_,i)=>i)}state.q=a[Math.floor(Math.random()*a.length)];state.used.push(state.q);state.answer=null;state.round++;save();render()}function answer(i){if(state.answer!==null)return;state.answer=i;if(i===qs[state.q][2])state.score[state.players[state.current]]++;save();render()}function next(){state.current=(state.current+1)%state.players.length;nextQuestion()}function game(e){let p=state.players[state.current],q=qs[state.q];e.innerHTML=`<div class="topbar"><button class="secondary" style="width:auto" onclick="home()">⌂ Início</button><button class="secondary" style="width:auto" onclick="central()">🎮 Central</button></div><div class="card"><span class="badge">PERGUNTA ${state.round}</span><div class="big">🧑 ${esc(p)}</div><div class="prompt">${esc(q[0])}</div><div class="grid" style="margin-top:12px">${q[1].map((x,i)=>`<button class="secondary" style="text-align:left" onclick="answer(${i})" ${state.answer!==null?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join('')}</div>${state.answer!==null?`<div class="card" style="margin-top:14px;margin-bottom:0;text-align:center;background:#30203f"><b>${state.answer===q[2]?'✅ Acertou! +1 ponto':'❌ Errou!'}</b><div class="notice">Resposta correta: <b>${esc(q[1][q[2]])}</b></div><button class="primary" style="margin-top:12px" onclick="next()">➡️ Próximo jogador</button></div>`:''}</div><div class="card"><b>Pontuação</b><div class="score" style="margin-top:10px">${state.players.map(x=>`<div><b>${state.score[x]||0}</b>${esc(x)}</div>`).join('')}</div></div>`}try{let x=JSON.parse(localStorage.getItem('quizGame'));if(x)Object.assign(state,x)}catch(e){}render();</script></body></html>
