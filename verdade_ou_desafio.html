<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Verdade ou Desafio</title>
<style>
:root{--bg:#120c1f;--card:#211532;--card2:#2d1d40;--pink:#ff4f9a;--purple:#8b5cf6;--green:#38d39f;--red:#ff667a;--yellow:#ffd166;--blue:#5db7ff;--text:#fff;--muted:#c9bdd6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2a1741,#120c1f 58%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:760px;margin:auto;padding:18px 16px 40px}.logo{text-align:center;margin:8px 0 22px}.logo .emoji{font-size:58px}.logo h1{font-size:34px;margin:0}.logo p{color:var(--muted);margin:7px 0}.card{background:rgba(33,21,50,.96);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:20px;box-shadow:0 15px 50px rgba(0,0,0,.3);margin-bottom:14px}.title{font-size:25px;font-weight:800;margin:0 0 7px}.muted{color:var(--muted)}.grid{display:grid;gap:10px}.row{display:flex;gap:10px}.row>*{flex:1}.primary{width:100%;padding:15px 18px;border-radius:15px;background:linear-gradient(135deg,var(--pink),var(--purple));color:white;font-weight:800}.secondary{width:100%;padding:13px 18px;border-radius:15px;background:#3a294d;color:white}.danger{background:#4b2532}.input,.select{width:100%;padding:14px;border-radius:14px;border:1px solid #554364;background:#160e24;color:white;outline:none;margin:7px 0}.player-list{display:grid;gap:9px;margin:14px 0}.player{display:flex;justify-content:space-between;align-items:center;background:#2b1b3d;padding:14px;border-radius:16px}.player b{font-size:17px}.number{color:#ff75ad;font-weight:900}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.tiny{font-size:12px;color:var(--muted)}.turn{text-align:center;color:#ffd1e6;font-weight:900;font-size:20px}.turn-sub{text-align:center;color:var(--muted);font-size:14px;margin-top:3px}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.choice{min-height:170px;border-radius:22px;color:#fff;padding:20px;font-size:25px;font-weight:950;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:.15s}.choice:active{transform:scale(.98)}.truth{background:linear-gradient(145deg,#247bd0,#5db7ff)}.dare{background:linear-gradient(145deg,#d62d72,#ff4f9a)}.choice small{font-size:13px;font-weight:600;color:rgba(255,255,255,.85)}.category{text-align:center;color:#cdb9dc;font-size:14px;margin-top:4px}.result{text-align:center}.result-type{font-size:13px;letter-spacing:1px;font-weight:900;margin-bottom:8px}.result h2{font-size:30px;line-height:1.12;margin:8px 0 20px}.truth-text{color:#7dc7ff}.dare-text{color:#ff75ad}.result-box{background:#2b1b3d;border-radius:20px;padding:24px 18px;font-size:22px;line-height:1.35;font-weight:800;min-height:150px;display:flex;align-items:center;justify-content:center}.next{margin-top:14px}.history{display:grid;gap:8px;max-height:250px;overflow:auto}.history-item{background:#2b1b3d;border-radius:13px;padding:10px 12px;font-size:13px;color:#d9cee2}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#453152;color:#e9dff0;font-size:11px;font-weight:800;margin-bottom:8px}.footer{text-align:center;color:#8f809e;font-size:12px;margin-top:20px}.winner{text-align:center}.winner .trophy{font-size:65px}.winner h2{font-size:31px;margin:5px 0}.hidden{display:none!important}
@media(max-width:500px){.app{padding:14px 12px}.logo h1{font-size:29px}.choice-grid{grid-template-columns:1fr}.choice{min-height:135px}}
</style>
</head>
<body>
<div class="app"><div id="app"></div><div class="footer">Jogo local • 1 celular • Sem banco de dados</div></div>
<script>
const TRUTHS={
"Geral":[
"Qual foi a coisa mais engraçada que já aconteceu com você?","Qual foi a maior vergonha que você já passou?","Qual é um hábito seu que pouca gente conhece?","Qual foi a última mentira boba que você contou?","Qual é a coisa que mais te irrita?","Qual é o seu maior medo?","Qual foi a melhor viagem que você já fez?","Qual foi a pior comida que você já experimentou?","Qual foi a compra mais inútil que você já fez?","Qual é uma coisa que você gostaria de aprender?","Qual foi o momento em que você mais riu na vida?","Qual é o seu maior sonho?","Qual é a sua mania mais estranha?","Qual foi a última vez que você chorou de rir?","Qual foi a decisão mais impulsiva que você já tomou?","Qual é uma coisa que você nunca faria?","Qual foi o maior susto que você já levou?","Qual é a sua comida favorita?","Qual é o seu filme favorito?","Qual pessoa você mais admira?","Qual foi o presente mais marcante que recebeu?","Qual é a sua maior qualidade?","Qual é um defeito seu que você reconhece?","Qual foi a situação mais constrangedora que viveu em público?","Qual foi a maior aventura que já viveu?","O que você faria se ganhasse um milhão de reais?","Qual lugar você gostaria muito de conhecer?","Qual foi a última coisa que pesquisou na internet?","Qual é uma coisa que você sempre quis dizer para alguém?","Qual foi o pior conselho que já recebeu?","Qual foi a coisa mais corajosa que já fez?","Qual é uma lembrança de infância que você gosta muito?","Qual é a sua música favorita atualmente?","Qual foi a última coisa que te deixou muito feliz?","Qual é uma coisa que você faria diferente se pudesse voltar no tempo?","Qual foi a maior loucura que já fez com amigos?","Você já fingiu gostar de alguma coisa para agradar alguém?","Qual é o seu maior objetivo para este ano?","Qual é a sua maior superstição?","Qual foi a desculpa mais criativa que já inventou?"],
"Amigos": [
"Quem do grupo você conheceu primeiro?","Com quem do grupo você viajaria?","Quem do grupo seria seu parceiro em uma competição?","Quem do grupo você chamaria para uma emergência?","Quem do grupo é mais parecido com você?","Quem do grupo te faz rir mais?","Quem do grupo você acha mais organizado?","Quem do grupo é mais provável de chegar atrasado?","Quem do grupo você escolheria para dividir um prêmio?","Qual foi a melhor lembrança com seus amigos?","Você já ficou bravo com um amigo e não contou?","Qual foi a maior aventura que viveu com amigos?","Você já esqueceu o aniversário de um amigo?","Qual foi a situação mais engraçada que aconteceu com seu grupo?","Qual amigo você conhece há mais tempo?","Você já fez uma surpresa para um amigo?","Qual característica você mais valoriza em uma amizade?","Você já guardou um segredo importante de um amigo?","Qual foi o melhor rolê que você já fez?","Você prefere poucos amigos próximos ou muitos conhecidos?"],
"Casal": [
"Qual foi sua primeira impressão sobre seu parceiro?","Qual foi o momento mais romântico que vocês viveram?","Quem tomou a iniciativa primeiro?","Qual foi o encontro mais marcante de vocês?","Qual característica do parceiro você mais admira?","Qual mania do parceiro mais te faz rir?","Qual foi a primeira coisa que você percebeu no parceiro?","Qual é a viagem que você gostaria de fazer a dois?","Qual é uma coisa que vocês deveriam fazer mais juntos?","Qual foi o presente mais marcante que recebeu do parceiro?","Quem é mais ciumento?","Quem pede desculpas primeiro?","Qual foi a situação mais engraçada que vocês viveram juntos?","Qual é o apelido mais engraçado que vocês usam?","Qual é uma lembrança de vocês que você nunca quer esquecer?","Qual é o programa perfeito para vocês dois?","Qual foi a maior surpresa que o parceiro já fez?","O que você mais gosta de fazer junto?","Qual qualidade do parceiro você gostaria de ter?","Qual sonho você gostaria de realizar com seu parceiro?" ]
};
const DARES={
"Geral":[
"Faça uma imitação de um animal até alguém descobrir qual é.","Dance por 30 segundos sem parar.","Cante o refrão de uma música escolhida pelo grupo.","Faça uma pose engraçada e fique nela por 15 segundos.","Imite uma pessoa famosa até alguém acertar.","Fale com sotaque por uma rodada.","Faça uma propaganda improvisada de um objeto próximo.","Conte uma piada sem rir.","Faça uma dancinha inventada.","Imite alguém do grupo de forma respeitosa.","Fale como um apresentador de televisão por 30 segundos.","Faça 10 polichinelos.","Caminhe como um modelo de passarela.","Faça uma cena dramática usando uma frase escolhida pelo grupo.","Tente falar o alfabeto rapidamente.","Faça uma estátua e deixe o grupo escolher a pose.","Imite um personagem de desenho animado.","Faça uma música usando três palavras escolhidas pelo grupo.","Finja que está recebendo um prêmio e faça um discurso.","Faça uma entrevista consigo mesmo por 30 segundos.","Faça uma imitação de um professor dando bronca.","Tente fazer o grupo rir sem tocar em ninguém.","Faça uma cena de novela improvisada.","Fale durante 30 segundos sem usar a palavra 'eu'.","Faça uma apresentação de dança em câmera lenta.","Finja que está vendendo um produto completamente inútil.","Faça cinco poses diferentes em sequência.","Imite alguém tentando pegar um ônibus atrasado.","Faça uma declaração de amor para um objeto da sala.","Fale como um robô durante 1 minuto.","Faça uma cena de filme de ação usando apenas movimentos.","Finja que ganhou na loteria.","Faça uma previsão do futuro para cada pessoa do grupo.","Imite um narrador de futebol descrevendo alguém pegando um copo.","Faça uma mímica de uma profissão.","Conte uma história inventada usando três objetos próximos.","Faça uma dança escolhida pelo grupo.","Tente equilibrar um objeto por 20 segundos.","Faça uma pose de capa de revista.","Faça um comercial de 30 segundos sobre água."],
"Amigos":[
"Faça uma imitação de alguém do grupo até descobrirem quem é.","Escolha alguém para uma disputa de pedra, papel e tesoura.","Faça uma dança em dupla com a pessoa à sua direita.","Conte uma história engraçada usando três palavras escolhidas pelos amigos.","Faça uma serenata improvisada para alguém do grupo.","Imite o jeito de falar de um amigo por 30 segundos.","Faça uma competição de caretas com alguém.","Crie um aperto de mão secreto com a pessoa à sua esquerda.","Faça uma pose para uma foto imaginária de grupo.","Faça uma propaganda de um amigo como se ele fosse famoso."],
"Casal":[
"Faça uma declaração de amor improvisada para seu parceiro.","Imite seu parceiro até ele descobrir o que você está fazendo.","Dance uma música imaginária com seu parceiro.","Faça uma serenata de 30 segundos.","Diga três qualidades do seu parceiro fazendo uma pose engraçada.","Recrie o primeiro encontro de vocês em 30 segundos.","Faça uma cena de novela sobre como vocês se conheceram.","Escolha uma música e faça uma dança improvisada juntos.","Faça uma propaganda do seu parceiro como se fosse um produto incrível.","Dê um abraço no parceiro por 10 segundos, se ambos quiserem."]
};
TRUTHS.Geral=[...new Set(TRUTHS.Geral)];TRUTHS.Amigos=[...new Set(TRUTHS.Amigos)];TRUTHS.Casal=[...new Set(TRUTHS.Casal)];
DARES.Geral=[...new Set(DARES.Geral)];DARES.Amigos=[...new Set(DARES.Amigos)];DARES.Casal=[...new Set(DARES.Casal)];
const state={screen:'home',players:[],current:0,category:'Geral',type:null,prompt:'',usedTruth:{},usedDare:{},history:[]};
const $=id=>document.getElementById(id);const save=()=>localStorage.setItem('verdadeDesafioGame',JSON.stringify(state));
function load(){try{const x=JSON.parse(localStorage.getItem('verdadeDesafioGame'));if(x&&Array.isArray(x.players)){Object.assign(state,x);state.usedTruth=state.usedTruth||{};state.usedDare=state.usedDare||{};state.history=state.history||[]}}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function goCentral(){location.href='index.html'}
function goHome(){state.screen='home';state.type=null;save();render()}
function render(){const el=$('app');if(state.screen==='home')home(el);else if(state.screen==='setup')setup(el);else if(state.screen==='game')game(el);else if(state.screen==='result')result(el)}
function home(el){el.innerHTML=`<div class="logo"><div class="emoji">🎭</div><h1>Verdade ou Desafio</h1><p>Jogo de festa • um celular</p></div><div class="card"><div class="title">Pronto para jogar?</div><p class="muted">Cadastre os participantes e passe o celular para quem estiver na vez.</p><div class="grid"><button class="primary" onclick="openSetup()">⚙️ Configurar partida</button><button class="secondary" onclick="goCentral()">🎮 Voltar para a Central</button></div></div><div class="card"><b>Como jogar</b><p class="muted">O jogador da vez escolhe <b>Verdade</b> ou <b>Desafio</b>. O jogo sorteia uma opção. Depois de cumprir ou responder, toque em <b>Próximo jogador</b>.</p></div>`}
function openSetup(){state.screen='setup';save();render()}
function setup(el){const rows=state.players.map((p,i)=>`<div class="player"><div><b>${esc(p)}</b><div class="tiny">Jogador ${i+1}</div></div><span class="number">#${i+1}</span></div>`).join('');el.innerHTML=`<div class="topbar"><button class="secondary" style="width:auto;padding:9px 13px" onclick="goHome()">← Voltar</button><span class="tiny">CONFIGURAÇÃO</span></div><div class="card"><div class="title">Cadastre os jogadores</div><p class="muted">Adicione pelo menos 2 participantes.</p><div class="row"><input class="input" id="playerName" placeholder="Ex.: Ana" onkeydown="if(event.key==='Enter')addPlayer()"><button class="primary" style="flex:0 0 125px;margin:7px 0" onclick="addPlayer()">Adicionar</button></div><div class="player-list">${rows||'<p class="muted">Nenhum jogador cadastrado.</p>'}</div><label class="tiny">Categoria</label><select class="select" id="category"><option>Geral</option><option>Amigos</option><option>Casal</option></select><div class="row"><button class="secondary" onclick="clearPlayers()">Limpar</button><button class="primary" onclick="startGame()" ${state.players.length<2?'disabled':''}>Começar jogo</button></div></div>`}
function addPlayer(){const input=$('playerName');const n=input.value.trim();if(!n)return;if(state.players.length>=20)return alert('Limite de 20 jogadores.');state.players.push(n);input.value='';save();render()}
function clearPlayers(){state.players=[];state.current=0;state.history=[];state.usedTruth={};state.usedDare={};save();render()}
function startGame(){if(state.players.length<2)return;state.category=$('category').value;state.current=0;state.type=null;state.prompt='';state.history=[];state.usedTruth={};state.usedDare={};state.screen='game';save();render()}
function pick(type){state.type=type;const pool=(type==='truth'?TRUTHS:DARES)[state.category]||[];const used=type==='truth'?state.usedTruth:state.usedDare;const key=state.category;if(!used[key])used[key]=[];let available=pool.map((_,i)=>i).filter(i=>!used[key].includes(i));if(!available.length){used[key]=[];available=pool.map((_,i)=>i)}const idx=available[Math.floor(Math.random()*available.length)];used[key].push(idx);state.prompt=pool[idx];state.history.unshift({player:state.players[state.current],type,prompt:state.prompt});state.history=state.history.slice(0,20);state.screen='result';save();render()}
function nextPlayer(){state.current=(state.current+1)%state.players.length;state.type=null;state.prompt='';state.screen='game';save();render()}
function game(el){const p=state.players[state.current];el.innerHTML=`<div class="topbar"><div class="row" style="flex:0 0 auto"><button class="secondary" style="width:auto;padding:9px 13px" onclick="goHome()">⌂ Início</button><button class="secondary" style="width:auto;padding:9px 13px" onclick="goCentral()">🎮 Central</button></div><span class="tiny">SUA VEZ</span></div><div class="card"><div class="turn">${esc(p)}</div><div class="turn-sub">Jogador ${state.current+1} • Categoria: ${esc(state.category)}</div><div class="choice-grid"><button class="choice truth" onclick="pick('truth')">🤫 VERDADE<small>Responda com sinceridade</small></button><button class="choice dare" onclick="pick('dare')">🔥 DESAFIO<small>Faça a tarefa</small></button></div></div><div class="card"><span class="badge">ORDEM DA PARTIDA</span><div class="history">${state.players.map((x,i)=>`<div class="history-item">${i===state.current?'👉 ':''}<b>${esc(x)}</b> ${i===state.current?'• aguardando escolha':''}</div>`).join('')}</div></div>`}
function result(el){const p=state.players[state.current];const truth=state.type==='truth';el.innerHTML=`<div class="topbar"><button class="secondary" style="width:auto;padding:9px 13px" onclick="goHome()">⌂ Início</button><span class="tiny">RODADA</span></div><div class="card result"><div class="turn">${esc(p)}</div><div class="result-type ${truth?'truth-text':'dare-text'}">${truth?'🤫 VERDADE':'🔥 DESAFIO'}</div><div class="result-box">${esc(state.prompt)}</div><div class="notice">Depois que o jogador responder ou cumprir o desafio, passe o celular para o próximo.</div><button class="primary next" onclick="nextPlayer()">➡️ PRÓXIMO JOGADOR</button><button class="secondary next" onclick="state.type=null;state.prompt='';state.screen='game';save();render()">🔄 Escolher novamente</button></div><div class="card"><b>Histórico</b><div class="history" style="margin-top:10px">${state.history.slice(0,8).map(h=>`<div class="history-item"><b>${esc(h.player)}</b> • ${h.type==='truth'?'Verdade':'Desafio'}<br>${esc(h.prompt)}</div>`).join('')}</div></div>`}
load();render();
</script>
</body>
</html>
